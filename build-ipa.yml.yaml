name: Build unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Archive (unsigned)
        run: |
          xcodebuild archive \
            -project "Husk App/husk.xcodeproj" \
            -scheme husk \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/husk.xcarchive \
            -skipMacroValidation -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/husk.xcarchive/Products/Applications/*.app Payload/
          zip -qry Husk.ipa Payload
          unzip -l Husk.ipa | head -20

      - uses: actions/upload-artifact@v4
        with:
          name: Husk-unsigned-ipa
          path: Husk.ipa
